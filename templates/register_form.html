<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація {{ role }}</title>
</head>
<body>
<h2>Реєстрація {{ role }}</h2>
<form method = "post">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Логін"><br>
    <input type="password" name="password" placeholder="Пароль"><br>
    <input type="text" name="full_name" placeholder="ПІБ"><br>
    <input type="number" name="store_id" placeholder="ID магазину"><br>
    <button type="submit">Зареєструватись</button>
</form>
<p>Акаунт вже існує?
    <a href="{% url login_url %}">Увійти як {{ role }}</a>
</p>
<p>
    <a href="{% url 'home' %}">Повернутись на головну сторінку</a>
</p>
</body>
</html>
