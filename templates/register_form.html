{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація {{ role_display }}</title>
    <link rel="stylesheet" href="{% static 'css/register_styles.css' %}">
</head>
<body>
<h2>Реєстрація {{ role_display }}</h2>
<form method = "post">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Логін"><br>
    <input type="password" name="password" placeholder="Пароль"><br>
    <input type="text" name="full_name" placeholder="ПІБ"><br>
    <input type="number" name="store_id" placeholder="ID магазину" min="1"><br>
    <button type="submit">Зареєструватись</button>
</form>
<p>Акаунт вже існує?
   <a href="{% url 'login' role=role_latin %}">Увійти як {{ role_display }}</a>
</p>
<p>
    <a href="{% url 'home' %}">Повернутись на головну сторінку</a>
</p>
</body>
</html>
